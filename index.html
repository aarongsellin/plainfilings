<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>plainfilings</title>
    <meta
      name="description"
      content="plainfilings routes visitors to the appropriate locale page."
    />
    <meta name="robots" content="noindex,follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="plainfilings" />
    <meta
      property="og:description"
      content="plainfilings routes visitors to the appropriate locale page."
    />
    <meta property="og:url" content="https://plainfilings.com/" />
    <meta
      property="og:image"
      content="https://plainfilings.com/live-feed-demo.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="plainfilings" />
    <meta
      name="twitter:description"
      content="plainfilings routes visitors to the appropriate locale page."
    />
    <meta
      name="twitter:image"
      content="https://plainfilings.com/live-feed-demo.png"
    />
    <script>
      (function () {
        var path = window.location.pathname.replace(/\/+$/, "") || "/";
        if (path !== "/" && path !== "/index.html") return;

        var targetPath = "/en/";
        var controller = window.AbortController ? new AbortController() : null;
        var timeoutId = null;

        if (controller) {
          timeoutId = window.setTimeout(function () {
            controller.abort();
          }, 1500);
        }

        var request = controller
          ? fetch("https://api.country.is/", { signal: controller.signal })
          : fetch("https://api.country.is/");

        request
          .then(function (response) {
            if (!response.ok) throw new Error("Geo lookup failed");
            return response.json();
          })
          .then(function (data) {
            var countryCode = String(
              data && (data.country || data.country_code || ""),
            ).toUpperCase();
            if (countryCode === "SE") targetPath = "/sv/";
          })
          .catch(function () {
            targetPath = "/en/";
          })
          .then(function () {
            if (timeoutId !== null) window.clearTimeout(timeoutId);
            window.location.replace(
              targetPath + window.location.search + window.location.hash,
            );
          });
      })();
    </script>
  </head>
  <body></body>
</html>
